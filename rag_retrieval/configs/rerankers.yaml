# Конфиг reranker'ов. Используется evaluate_with_reranker.py.
#
# backend:
#   sentence_transformers_cross_encoder — основной, через CrossEncoder из sentence-transformers.
#   flag_embedding                       — альтернатива через FlagReranker (FlagEmbedding),
#                                          даёт чуть лучшие числа на BGE-рерренкерах,
#                                          требует pip install FlagEmbedding.

rerankers:
  bge_reranker_v2_m3:
    model_name: "BAAI/bge-reranker-v2-m3"
    backend: "sentence_transformers_cross_encoder"
    batch_size: 16
    max_length: 1024
    trust_remote_code: true

  # Тот же reranker через FlagEmbedding — если установлен FlagEmbedding,
  # можно сравнить или использовать как замену.
  bge_reranker_v2_m3_flag:
    model_name: "BAAI/bge-reranker-v2-m3"
    backend: "flag_embedding"
    batch_size: 16
    max_length: 1024
    trust_remote_code: true

  # Лёгкий мультиязычный CE для быстрых прогонов / отладки.
  ms_marco_minilm:
    model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    backend: "sentence_transformers_cross_encoder"
    batch_size: 32
    max_length: 512
    trust_remote_code: false
