experiment:
  name: "exp_llm_eval_v1"
  description: "LLM-as-a-judge evaluation поверх готового rag_vs_no_rag_pairs.jsonl (smoke)"
  output_dir: "runs/exp_llm_eval_v1"
  seed: 42
  overwrite: true

# Все upstream-этапы выключены — оцениваем только пары RAG/no-RAG из другого
# эксперимента (например, runs/exp_full_v1).
data:
  retrieval_queries_path: "data/retrieval_eval_queries_plus_hard_v1.jsonl"
  clinical_cases_path: "data/clinical_cases_v1.jsonl"
  chunks_path: "data/chunks_v1.jsonl"

artifacts:
  embeddings_root: "outputs/embeddings"
  embeddings_dir: "outputs/embeddings/e5_large"

retrieval_eval:
  enabled: false

reranking_eval:
  enabled: false
  embedding_model_key: "e5_large"
  embedding_config: "configs/embedding_models.yaml"
  embeddings_dir: "outputs/embeddings/e5_large"
  reranker_key: "bge_reranker_v2_m3"
  reranker_config: "configs/rerankers.yaml"

generation:
  enabled: false
  llm_config: "configs/llm.yaml"
  prompt_config_rag: "configs/prompts/rag_diagnostic_v2_strict.yaml"
  prompt_config_no_rag: "configs/prompts/no_rag_diagnostic_v2_baseline.yaml"

comparison:
  enabled: false

llm_evaluation:
  enabled: true
  # Источник пар: можно либо взять готовые pairs из другого эксперимента,
  # либо null → возьмём <output_dir>/generation/rag_vs_no_rag_pairs.jsonl.
  pairs_path: "runs/exp_full_v1/generation/rag_vs_no_rag_pairs.jsonl"
  rag_answers_path: null
  no_rag_answers_path: null
  llm_config: "configs/llm.yaml"
  judge_provider: null      # null = взять из llm.yaml; для smoke — "mock"
  judge_model: null
  judge_prompt_config: "configs/prompts/judge_faithfulness_v1.yaml"
  citation_judge_prompt_config: "configs/prompts/judge_citation_accuracy_v1.yaml"
  relevance_judge_prompt_config: "configs/prompts/judge_answer_relevance_v1.yaml"
  limit: 5
  mode: "both"
  max_claims_per_answer: 20
  judge_max_retries: 1
  resume: false
