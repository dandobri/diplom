# LLM-конфигурация. Используется LLMClient в src/llm_client.py.
#
# Активный сценарий: openai-совместимый endpoint с КАСТОМНЫМ base_url
# (например, прокси, vLLM/LM Studio, корпоративный шлюз) и своим api key.
#
# Никаких ключей и URL'ов в репозиторий не коммитим:
#   api_key_env  — имя env-переменной с api key
#   base_url_env — имя env-переменной с base URL (имеет приоритет над base_url)
#   base_url     — fallback, если env-переменная не задана; null = api.openai.com
#
# Пример настройки в shell:
#   export OPENAI_API_KEY="sk-..."
#   export OPENAI_BASE_URL="https://my-proxy.example.com/v1"

llm:
  provider: "openai_compatible"
  model_name: "gpt-4o-mini"

  api_key_env: "OPENAI_API_KEY"
  base_url: https://openrouter.ai/api/v1               # если env-переменная не задана и тут null → используется api.openai.com

  temperature: 0.1
  max_tokens: 4000             # был 1500 — judge возвращает длинный JSON со списком claim_evaluations,
                               # 1500 обрывал JSON в "Unterminated string" → 30% кейсов теряло оценку.
  timeout_sec: 180             # был 120 — длинный output дольше генерится
  request_json_mode: true      # OpenAI response_format=json_object; авто-fallback, если backend не поддерживает

providers:
  openai_compatible:
    type: "openai"

  ollama:
    type: "ollama"
    base_url: "http://localhost:11434"
    base_url_env: "OLLAMA_BASE_URL"
    model_name: "llama3.1"
    api_key_env: null

  mock:
    type: "mock"
    model_name: "mock-llm"
